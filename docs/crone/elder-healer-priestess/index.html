<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to Witness</title>
    <link rel="canonical" href="/crone/witness/">
    <script>
      (function () {
        const shadowRedirects = {"#shadow-martyred-healer":"/crone/witness/shadows/martyred-healer/","#shadow-cynical-healer":"/crone/witness/shadows/cynical-healer/"};
        const target = shadowRedirects[window.location.hash] || "/crone/witness/";
        window.location.replace(target);
      }());
    </script>
    <meta http-equiv="refresh" content="0; url=/crone/witness/">
  </head>
  <body>
    <p>This page has moved to <a href="/crone/witness/">Witness</a>.</p>
  </body>
</html>

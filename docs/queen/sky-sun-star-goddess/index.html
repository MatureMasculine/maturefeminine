<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to Luminary</title>
    <link rel="canonical" href="/queen/luminary/">
    <script>
      (function () {
        const shadowRedirects = {"#shadow-blinding-sun":"/queen/luminary/shadows/blinding-star/","#shadow-hidden-star":"/queen/luminary/shadows/hidden-light/"};
        const target = shadowRedirects[window.location.hash] || "/queen/luminary/";
        window.location.replace(target);
      }());
    </script>
    <meta http-equiv="refresh" content="0; url=/queen/luminary/">
  </head>
  <body>
    <p>This page has moved to <a href="/queen/luminary/">Luminary</a>.</p>
  </body>
</html>

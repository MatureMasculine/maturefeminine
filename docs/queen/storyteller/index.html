<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to Storyteller</title>
    <link rel="canonical" href="/crone/storyteller/">
    <script>
      (function () {
        const shadowRedirects = {"#shadow-exaggerating-dramatist":"/crone/storyteller/shadows/exaggerating-dramatist/","#shadow-silent-keeper":"/crone/storyteller/shadows/silent-keeper/"};
        const target = shadowRedirects[window.location.hash] || "/crone/storyteller/";
        window.location.replace(target);
      }());
    </script>
    <meta http-equiv="refresh" content="0; url=/crone/storyteller/">
  </head>
  <body>
    <p>This page has moved to <a href="/crone/storyteller/">Storyteller</a>.</p>
  </body>
</html>

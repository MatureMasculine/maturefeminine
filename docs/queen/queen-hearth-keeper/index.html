<!DOCTYPE html>

  <head>

    <title>Redirecting to Queen</title>
    <link rel="canonical" href="/queen/queen/">
    <script>
      (function () {
        const shadowRedirects = {"#shadow-tyrannical-empress":"/queen/queen/shadows/tyrannical-queen/","#shadow-abdicated-ruler":"/queen/queen/shadows/abdicating-queen/"};
        const target = shadowRedirects[window.location.hash] || "/queen/queen/";

      }());
    </script>

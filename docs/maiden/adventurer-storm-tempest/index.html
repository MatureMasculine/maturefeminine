<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to Adventurer</title>
    <link rel="canonical" href="/maiden/adventurer/">
    <script>
      (function () {
        const shadowRedirects = {"#shadow-reckless-storm":"/maiden/adventurer/shadows/reckless-wanderer/","#shadow-paralyzed-dreamer":"/maiden/adventurer/shadows/sheltered-dreamer/"};
        const target = shadowRedirects[window.location.hash] || "/maiden/adventurer/";
        window.location.replace(target);
      }());
    </script>
    <meta http-equiv="refresh" content="0; url=/maiden/adventurer/">
  </head>
  <body>
    <p>This page has moved to <a href="/maiden/adventurer/">Adventurer</a>.</p>
  </body>
</html>
